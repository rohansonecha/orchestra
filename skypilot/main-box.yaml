# main-box.yaml — Long-lived OpenClaw orchestrator
#
# Launch:
#   source private/env
#   sky launch --infra "$SKY_INFRA" -c main-box skypilot/main-box.yaml
#
# Required env vars (set in private/env, passed via --env):
#   GLM_API_KEY      vLLM bearer token
#   GLM_BASE_URL     vLLM OpenAI endpoint (e.g. http://host/v1)
#   SKY_API_ENDPOINT SkyPilot API server URL (for launching subagent sandboxes)
#   SKY_API_TOKEN    SkyPilot API server service-account token
#
# Private files copied via file_mounts (from private/ on the launching machine):
#   private/models.json   → ~/.pi/agent/models.json  (real GLM endpoint)
#   private/agents/work.md → ~/.pi/agent/agents/work.md (real work recipe)

resources:
  cloud: kubernetes
  cpus: 4
  memory: 16

# No GPU needed on the orchestrator box — agents run on separate sandboxes.
image_id: docker:ubuntu:22.04

# Copy private config from the launching machine.
# These files are in private/ (gitignored) and never committed.
file_mounts:
  /root/.pi/agent/models.json: private/models.json
  /root/.pi/agent/agents/work.md: private/agents/work.md

# Env vars passed through from the launching machine via --env.
# GLM_API_KEY is resolved at runtime by pi's !printf command in models.json.
envs:
  GLM_BASE_URL: $GLM_BASE_URL

setup: |
  set -euo pipefail

  # --- Node.js (for openclaw + pi) ---
  curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  apt-get install -y nodejs git

  # --- Python (for sky CLI) ---
  apt-get install -y python3 python3-pip
  ln -sf /usr/bin/python3 /usr/bin/python

  # --- Install pi coding agent ---
  npm install -g --ignore-scripts @earendil-works/pi-coding-agent

  # --- Install sky CLI ---
  pip3 install --upgrade pip
  pip3 install "skypilot[kubernetes]"

  # --- Login sky to the SkyPilot API server ---
  # Token is passed via --env SKY_API_TOKEN
  sky api login -e "$SKY_API_ENDPOINT" --token "$SKY_API_TOKEN" || {
    echo "WARNING: sky api login failed; subagent launching will not work"
  }

  # --- Clone this repo (for YAMLs + skill code) ---
  git clone https://github.com/rohansonecha/orchestra.git /root/orchestra

  # --- Install OpenClaw ---
  npm install -g openclaw@latest

  # --- Configure OpenClaw ---
  # openclaw onboard will be run manually on first boot (interactive),
  # OR configured via openclaw config files in a later step.
  # For now, the gateway is started manually after SSH-ing in.

run: |
  # Keep the box alive. OpenClaw gateway is started as a systemd service
  # (configured during onboard). This just prevents the cluster from going idle.
  echo "Main box ready. SSH in and run: openclaw onboard --install-daemon"
  sleep infinity
