# work-agent.yaml — Ephemeral coding sandbox (one per task/project)
#
# Launched by the OpenClaw sky-coding-agent skill, or manually for testing:
#   sky launch --infra "$SKY_INFRA" -c work-agent-<task-id> skypilot/work-agent.yaml
#
# Required env vars (passed via --env from the main box):
#   GLM_API_KEY  vLLM bearer token
#
# Private files copied via file_mounts:
#   private/models.json   → ~/.pi/agent/models.json
#   private/agents/work.md → ~/.pi/agent/agents/work.md (work recipe)

resources:
  cloud: kubernetes
  cpus: 8
  memory: 32
  # No GPU — coding agents don't need GPU; GLM runs on a separate vLLM cluster.
  # Add `accelerators: L4:1` etc. here if a task needs local GPU.

file_mounts:
  ~/.pi/agent/models.json: private/models.json
  ~/.pi/agent/agents/work.md: private/agents/work.md

envs:
  GLM_API_KEY: $GLM_API_KEY

setup: |
  set -euo pipefail

  # --- Node.js 22 (for pi) ---
  curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
  sudo apt-get install -y nodejs

  # --- Install pi coding agent ---
  sudo npm install -g --ignore-scripts @earendil-works/pi-coding-agent

  # --- Git config (for agent commits) ---
  git config --global user.name "Orchestra Agent"
  git config --global user.email "agent@orchestra.local"
  git config --global init.defaultBranch main

  # --- Workspace dir ---
  mkdir -p ~/workspace

run: |
  echo "Work agent ready. Drive via:"
  echo "  sky exec <cluster> 'pi -p \"hello\" --provider glm --model zai-org/GLM-5.2-FP8'"
  sleep infinity
