# agent-template.yaml — SkyPilot template for orchestra sub-agents.
#
# Rendered by tree-view/gen-agent-yaml.py from a config JSON. Variables in
# double-brace placeholders are substituted by the generator; shell ${VARS}
# in setup/run are resolved by SkyPilot at launch time.
#
# Design_Document.md §8. This is main-box.yaml minus the OpenClaw
# workspace file mounts (sub-agents get workspace files via their config,
# not hardcoded) plus:
#   1. openclaw-bridge install + start
#   2. ~/.orchestra/agent-token (per-agent secret)
#   3. launch-sub-agent OpenClaw skill
#   4. run: register with the main-box collector, then sleep infinity
#   5. Env vars ORCHESTRA_PARENT_URL + ORCHESTRA_COLLECTOR_URL
#
# Rendered launch:
#   sky launch --infra "$SKY_INFRA" -c agent-{{AGENT_NAME}} /tmp/agent-{{AGENT_NAME}}.yaml

resources:
  cloud: {{CLOUD}}
  cpus: {{CPUS}}
  memory: {{MEMORY}}
  {{#GPU}}accelerators: {{GPU}}{{/GPU}}

# No file_mounts for OpenClaw workspace — sub-agents get workspace files
# via their config (Design §7), not hardcoded here. Private config that
# every agent needs (models.json, env) is mounted below.
file_mounts:
  ~/.pi/agent/models.json: private/models.json
  ~/.pi/agent/agents/work.md: private/agents/work.md
  ~/.pi/agent/themes/orchestra.json: skypilot/pi-theme.json
  ~/.openclaw/openclaw.json: private/openclaw/openclaw.json

secrets:
  - secrets:ORCHESTRA_API_KEY
  - secrets:SKY_API_ENDPOINT
  - secrets:ORCHESTRA_SKY_API_TOKEN
  - secrets:GIT_EMAIL
  - secrets:GIT_NAME
  - secrets:GITHUB_TOKEN
  - secrets:LINEAR_TOKEN

# Per-agent env vars (set by the generator from the spawn config).
envs:
  ORCHESTRA_AGENT_ID: "{{AGENT_ID}}"
  ORCHESTRA_AGENT_NAME: "{{AGENT_NAME}}"
  ORCHESTRA_PARENT_URL: "{{PARENT_URL}}"
  ORCHESTRA_COLLECTOR_URL: "{{COLLECTOR_URL}}"
  ORCHESTRA_MODEL: "{{MODEL}}"

setup: |
  set -euo pipefail

  # --- Node.js 22 (for openclaw + pi) ---
  curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
  sudo apt-get install -y nodejs tmux

  # --- Install Rust (for the TUI, if needed on this box) ---
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  source ~/.cargo/env

  # --- Install pi coding agent ---
  sudo npm install -g --ignore-scripts @earendil-works/pi-coding-agent

  # --- Patch pi: remove italic from thinking text ---
  PI_MSG_JS=$(find /usr/lib/node_modules/@earendil-works/pi-coding-agent -path '*/components/assistant-message.js' | head -1)
  if [ -n "$PI_MSG_JS" ]; then
    sudo sed -i 's/italic: true,/italic: false,/' "$PI_MSG_JS"
    sudo sed -i 's/theme\.italic(theme\.fg("thinkingText"/theme.fg("thinkingText"/' "$PI_MSG_JS"
  fi
  echo '{"theme":"orchestra"}' > ~/.pi/agent/settings.json

  # --- Install sky CLI ---
  pip3 install --upgrade pip
  pip3 install "skypilot[kubernetes]"
  export SKY_API_TOKEN="$ORCHESTRA_SKY_API_TOKEN"
  sky api login -e "$SKY_API_ENDPOINT" --token "$ORCHESTRA_SKY_API_TOKEN" || {
    echo "WARNING: sky api login failed"
  }

  # --- Git config ---
  git config --global user.name "$GIT_NAME"
  git config --global user.email "$GIT_EMAIL"
  git config --global init.defaultBranch main

  # --- Clone orchestra repo ---
  git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/rohansonecha/orchestra.git" ~/orchestra

  # --- Install OpenClaw ---
  sudo npm install -g openclaw@latest

  # --- tmux config ---
  cat > ~/.tmux.conf << 'TMUXCONF'
  set -g default-terminal "screen-256color"
  set -ga terminal-overrides ",*256col*:Tc"
  set -g extended-keys on
  set -g remain-on-exit on
  bind-key -n Left if-shell -F '#{==:#{cursor_x},0}' detach-client 'send-keys Left'
  bind-key -n C-c detach-client
  TMUXCONF

  # --- Persist secret env vars for SSH sessions ---
  mkdir -p ~/.orchestra ~/.openclaw/workspace
  {
    echo "ORCHESTRA_API_KEY=$ORCHESTRA_API_KEY"
    echo "GLM_API_KEY=$ORCHESTRA_API_KEY"  # legacy alias for old configs
    echo "SKY_API_ENDPOINT=$SKY_API_ENDPOINT"
    echo "ORCHESTRA_SKY_API_TOKEN=$ORCHESTRA_SKY_API_TOKEN"
    echo "SKY_API_TOKEN=$ORCHESTRA_SKY_API_TOKEN"  # conventional alias
    echo "GIT_EMAIL=$GIT_EMAIL"
    echo "GIT_NAME=$GIT_NAME"
    echo "GITHUB_TOKEN=$GITHUB_TOKEN"
    echo "LINEAR_TOKEN=$LINEAR_TOKEN"
  } > ~/.orchestra/env
  chmod 600 ~/.orchestra/env

  # --- Skills directory ---
  ln -sfn ~/orchestra/skills ~/.orchestra/skills

  # --- Per-agent token (generated by the launcher, written at launch) ---
  # The token authenticates A2A calls to this agent's bridge.
  echo '{{AGENT_TOKEN}}' > ~/.orchestra/agent-token
  chmod 600 ~/.orchestra/agent-token

  # --- Start OpenClaw gateway ---
  mkdir -p ~/.openclaw/workspace
  openclaw daemon install || true
  openclaw daemon start || true

  # --- Start openclaw-bridge (A2A HTTP front-end) ---
  nohup python3 ~/orchestra/tree-view/openclaw-bridge.py \
    --port {{BRIDGE_PORT}} \
    > ~/.orchestra/bridge.log 2>&1 &

run: |
  # Register with the main-box collector, then keep the box alive.
  python3 - <<'PY'
  import json, os, urllib.request
  collector = os.environ["ORCHESTRA_COLLECTOR_URL"].rstrip("/")
  agent_id = os.environ["ORCHESTRA_AGENT_ID"]
  agent_name = os.environ["ORCHESTRA_AGENT_NAME"]
  token = open(os.path.expanduser("~/.orchestra/agent-token")).read().strip()
  host = os.environ.get("ORCHESTRA_BOX_HOST", agent_id)
  port = {{BRIDGE_PORT}}
  node = {
      "id": agent_id,
      "kind": "agent",
      "parent_id": None,  # the collector attaches via POST /tree/edge
      "name": agent_name,
      "display_name": None,
      "sky_cluster": agent_id,
      "tmux_session": None,
      "box_host": host,
      "bridge_url": f"http://{host}:{port}/",
      "gateway_url": "ws://localhost:18789",
      "state": "initializing",
      "config": {},
      "openclaw_sessions": [],
      "pi_sessions": [],
      "created_at": int(__import__("time").time()),
      "last_pulled": 0,
      "children": [],
  }
  body = json.dumps(node).encode()
  req = urllib.request.Request(collector + "/tree/node", data=body,
                               headers={"Content-Type": "application/json"})
  try:
      urllib.request.urlopen(req, timeout=10)
      print(f"registered {agent_id} with collector")
  except Exception as e:
      print(f"collector registration failed: {e}")
  PY
  echo "Sub-agent {{AGENT_ID}} ready. Bridge on :{{BRIDGE_PORT}}."
  sleep infinity
