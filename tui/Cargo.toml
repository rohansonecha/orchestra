[package]
name = "orchestra"
version = "0.1.0"
edition = "2021"
description = "Agent orchestration platform: run Claude Code, Codex and pi sessions in parallel worktrees and move work between them"

[[bin]]
name = "orchestra"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
